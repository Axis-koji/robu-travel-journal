<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>運営者ページは準備中です｜ろぶーの気になる事</title>
  <style>
    :root { --ink:#102933; --sea:#0e6c78; --deep:#082d39; --paper:#fffdf9; --coral:#ef765c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--deep); color:#fff; font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif; }
    header { min-height:68px; display:flex; align-items:center; padding:14px clamp(20px,5vw,58px); background:var(--paper); }
    .brand { color:var(--ink); font-size:20px; font-weight:900; text-decoration:none; }
    .brand span { color:var(--sea); }
    main { min-height:calc(100vh - 68px); display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,760px); align-items:center; gap:clamp(20px,5vw,70px); padding:clamp(34px,7vw,90px); background:radial-gradient(circle at 25% 35%,#15515d 0,transparent 44%),var(--deep); }
    .copy { position:relative; z-index:2; max-width:620px; }
    .eyebrow { margin:0 0 15px; color:#9edbd7; font-size:12px; font-weight:900; letter-spacing:.18em; }
    h1 { margin:0; font-family:Georgia,"Yu Mincho",serif; font-size:clamp(42px,7vw,84px); font-weight:500; line-height:1.18; }
    p { margin:24px 0 0; color:#d6e9e9; font-size:clamp(15px,2vw,18px); line-height:1.9; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:30px; }
    .actions a { border:1px solid var(--coral); border-radius:7px; padding:12px 18px; background:var(--coral); color:var(--ink); font-weight:800; text-decoration:none; }
    .actions a:focus-visible { outline:3px solid #fff; outline-offset:3px; }
    .scene { width:100%; max-height:72vh; object-fit:contain; filter:drop-shadow(0 24px 38px rgba(0,0,0,.28)); animation:bob 1.8s ease-in-out infinite alternate; }
    @keyframes bob { from { transform:translateY(0) rotate(-.25deg); } to { transform:translateY(-8px) rotate(.25deg); } }
    @media (prefers-reduced-motion:reduce) { .scene { animation:none; } }
    @media (max-width:800px) { main { grid-template-columns:1fr; text-align:center; } .copy { margin:auto; } .actions { justify-content:center; } .scene { max-height:56vh; } }
  </style>
  <script defer src="/assets/js/shared-shell.js?v=20260913-formal-3"></script>
</head>
<body>
  <header><a class="brand" href="/">ろぶーの<span>気になる事</span></a></header>
  <main>
    <section class="copy">
      <p class="eyebrow">ABOUT ROBU</p>
      <h1>運営者ページは<br>ただいま準備中です</h1>
      <p>小さな工事係たちが、このページを丁寧に準備しています。完成まで、もう少しだけお待ちください。</p>
      <div class="actions"><a href="/">ホームへ戻る</a></div>
    </section>
    <img class="scene" src="/assets/images/coming-soon-guide-v7.png" alt="小さな工事係たちが踊りながら準備中を案内するイラスト" width="1536" height="1024">
  </main>
</body>
</html>
