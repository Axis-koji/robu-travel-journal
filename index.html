      ).sort((a,b)=>b.date.localeCompare(a.date));
    }

    function applyCategoryFilterFromLocation({ scroll = false } = {}) {
      const filterFromHash = window.location.hash.slice(1).toLowerCase();
      const categoryLink = [...document.querySelectorAll('.nav a[data-filter]')]
        .find((link) => link.dataset.filter === filterFromHash)
        || document.querySelector('.nav a[data-filter="all"]');

      activeFilter = categoryLink?.dataset.filter || 'all';
      selectedDigestDate = '';
      document.querySelectorAll('.nav a[data-filter]').forEach((link) => {
        if (link === categoryLink) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
      applyLanguage(currentLanguage);
      if (scroll && filterFromHash && categoryLink) {
        document.querySelector('#articles')?.scrollIntoView({ block: 'start' });
      }
    }

    function previewHref(article) {
      return article.url || '#latestDigest';
    }

    function renderDigest(article, locale) {
      const { title } = translated(article, locale);
      const digestTitle = currentLanguage === 'ja' ? (article.digestTitle || title) : title;
      digest.innerHTML = `<h2>${digestTitle}</h2>`;
    }

    function digestButtonLabel(article, locale) {
      return locale.latest;
    }

    function renderLanguageOptions(query = '') {
      const normalized = query.trim().toLowerCase();
      languageOptions.innerHTML = Object.entries(localeText)
        .filter(([, locale]) =>
          !normalized || `${locale.label} ${locale.aliases}`.toLowerCase().includes(normalized)
        )
        .map(([key, locale]) => `<button class="language-option" type="button" role="option" data-lang="${key}" aria-selected="${key===currentLanguage}">${locale.label}</button>`)
        .join('');

      languageOptions.querySelectorAll('.language-option').forEach((option) => {
        option.addEventListener('click', () => {
          languagePanel.hidden = true;
          languageTrigger.setAttribute('aria-expanded', 'false');
          saveLanguagePreference(option.dataset.lang);
          applyLanguage(option.dataset.lang);
          languageTrigger.focus();
        });
      });
    }

    function applyLanguage(language) {
      currentLanguage = localeText[language] ? language : 'ja';
      const locale = localeText[currentLanguage];
      document.documentElement.lang = locale.code;
      document.querySelectorAll('.nav a[data-filter]').forEach((item, index) => item.textContent = locale.nav[index]);
      const operatorLink = document.querySelector('.nav a:not([data-filter])');
      if (operatorLink) operatorLink.textContent = locale.operator;
      document.querySelector('.lead').innerHTML = locale.lead;
      document.querySelector('.section h2').textContent = locale.section;
      button.textContent = digest.classList.contains('open') ? locale.close : locale.latest;
      const legacyFooterBrand = document.querySelector('footer:not([data-robu-common-footer]) > strong');
      const legacyFooterPrivacy = document.querySelector('footer:not([data-robu-common-footer]) > a');
      const legacyFooterCopyright = document.querySelector('footer:not([data-robu-common-footer]) > span');
      // The official brand spelling never changes with the display language.
      if (legacyFooterBrand) legacyFooterBrand.textContent = 'ろぶーの気になる事';
      if (legacyFooterPrivacy) legacyFooterPrivacy.textContent = locale.privacy;
      if (legacyFooterCopyright) legacyFooterCopyright.textContent = '© 2026 ろぶーの気になる事';
      languageSearch.placeholder = locale.search;
      languageSearch.setAttribute('aria-label', locale.search);
      languageOptions.setAttribute('aria-label', locale.choose);
      document.querySelector('#apiConsentBanner small').textContent = currentLanguage === 'ja'
        ? '外部APIを利用する前に確認します。この操作を許可しますか？'
        : 'This action uses an external API. Do you want to allow it?';
      consentApprove.textContent = currentLanguage === 'ja' ? '許可する' : 'Allow';
      consentDeny.textContent = currentLanguage === 'ja' ? '今は許可しない' : 'Not now';

      const filteredArticles = visibleArticles();
      if (comingSoonFilters.has(activeFilter) || filteredArticles.length === 0) {
        const comingSoonImage = comingSoonImages[activeFilter] || comingSoonImages.fallback;
        cards.innerHTML = `<section class="coming-soon" aria-label="Coming... eventually" style="--coming-soon-image:url('${comingSoonImage}')"><div class="coming-soon-copy"><h3>Coming... eventually</h3><p>${locale.soon}</p></div></section>`;
        digest.classList.remove('open');
        button.setAttribute('aria-expanded', 'false');
        button.hidden = true;
      } else {
        button.hidden = false;
        cards.innerHTML = filteredArticles.map((article) => {
          const { title, excerpt } = translated(article, locale);
          const key = articleKey(article);
          const media = article.video
            ? `<video class="card-image" muted playsinline preload="metadata" poster="${article.image}" aria-label="${currentLanguage === 'ja' ? (photoDescriptions[key] || '') : title}"><source src="${article.video}" type="video/mp4"></video>`
            : article.spritePreview
              ? `<svg class="card-image" viewBox="0 0 384 512" role="img" aria-label="${currentLanguage === 'ja' ? (photoDescriptions[key] || '') : title}" preserveAspectRatio="xMidYMid meet"><image href="${article.image}" width="1536" height="1024"></image></svg>`
              : `<img class="card-image" src="${article.image}" alt="${currentLanguage === 'ja' ? (photoDescriptions[key] || '') : title}" loading="lazy" decoding="async" width="800" height="450">`;
          return `
            <article class="card">
              <a class="card-image-link article-preview-link" href="${previewHref(article)}" data-article-date="${key}" data-read-label="${locale.read}" aria-label="${title}">
                ${media}
              </a>
              <div class="card-body">
                <small>${article.category} / ${article.dateLabel}</small>
                <h3>${title}</h3>
                <p>${excerpt}</p>
                <a class="article-preview-link" href="${previewHref(article)}" data-article-date="${key}">${locale.read}</a>
              </div>
            </article>
          `;
        }).join('');
        if (!selectedDigestDate) selectedDigestDate = articleKey(filteredArticles[0] || articles[0]);
        const selectedArticle = getLocalArticle(selectedDigestDate) || filteredArticles[0] || articles[0];
        renderDigest(selectedArticle, locale);
        if (!digest.classList.contains('open')) button.textContent = digestButtonLabel(selectedArticle, locale);
      }
      renderLanguageOptions(languageSearch.value);
      languageTrigger.textContent = `Language: ${locale.label}`;
    }

    function bindEvents() {
      languageTrigger.addEventListener('click', () => {
        languagePanel.hidden = !languagePanel.hidden;
        languageTrigger.setAttribute('aria-expanded', String(!languagePanel.hidden));
        if (!languagePanel.hidden) { languageSearch.value=''; renderLanguageOptions(); languageSearch.focus(); }
      });

      languageSearch.addEventListener('input', () => renderLanguageOptions(languageSearch.value));
      languageSearch.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return;
        const first = languageOptions.querySelector('.language-option');
        if (first) first.click();
      });

      document.querySelector('.nav').addEventListener('click', (event) => {
        const categoryLink = event.target.closest('a[data-filter]');
        if (!categoryLink || event.defaultPrevented || event.button !== 0
          || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        const targetHash = new URL(categoryLink.href, window.location.href).hash.toLowerCase();
        if (window.location.hash.toLowerCase() === targetHash) {
          applyCategoryFilterFromLocation({ scroll: true });
        }
      });
      window.addEventListener('hashchange', () => applyCategoryFilterFromLocation({ scroll: true }));

      document.addEventListener('click', async (event) => {
        const pronunciation = event.target.closest('.vietnamese-phrase');
        if (pronunciation) {
          pronunciation.classList.toggle('is-reading');
          document.querySelectorAll('.vietnamese-phrase.is-reading').forEach((phrase) => {
            if (phrase !== pronunciation) phrase.classList.remove('is-reading');
          });
          return;
        }

        const articleLink = event.target.closest('.article-preview-link');
        if (!articleLink) return;
        const selectedArticle = getLocalArticle(articleLink.dataset.articleDate);
        if (!selectedArticle) return;
        if (previewHref(selectedArticle) !== '#latestDigest') return;
        event.preventDefault();
        selectedDigestDate = articleKey(selectedArticle);
        const locale = localeText[currentLanguage];
        renderDigest(selectedArticle, locale);
        digest.classList.add('open');
        button.setAttribute('aria-expanded', 'true');
        button.textContent = locale.close;
        requestAnimationFrame(() => digest.scrollIntoView({ behavior: 'smooth', block: 'center' }));
      });

      button.addEventListener('click', async () => {
        const locale = localeText[currentLanguage];
        if (!digest.classList.contains('open')) {
          selectedDigestDate = articleKey(visibleArticles()[0] || articles[0]);
          renderDigest(getLocalArticle(selectedDigestDate), locale);
          digest.classList.add('open');
          button.setAttribute('aria-expanded', 'true');
          button.textContent = locale.close;
        } else {
          digest.classList.remove('open');
          button.setAttribute('aria-expanded', 'false');
          const latestArticle = visibleArticles()[0] || articles[0];
          selectedDigestDate = articleKey(latestArticle);
          button.textContent = digestButtonLabel(latestArticle, locale);
        }
      });

      consentApprove.addEventListener('click', () => {
        hasApiPermission = true;
        localStorage.setItem(API_PERMISSION_KEY, 'true');
        syncApiConsentUI();
        while (waitingApiActions.length > 0) {
          const item = waitingApiActions.shift();
          try { item.resolve(item.action()); } catch (error) { item.reject(error); }
        }
      });
      consentDeny.addEventListener('click', () => {
        hasApiPermission = false;
        localStorage.setItem(API_PERMISSION_KEY, 'false');
        syncApiConsentUI();
        while (waitingApiActions.length > 0) {
          const item = waitingApiActions.shift();
          item.reject(new Error('API実行は事前許可がありません。'));
        }
      });
    }

    bindEvents();
    syncApiConsentUI();
    applyCategoryFilterFromLocation({ scroll: true });
    if (!isPreview) {
      consentBanner.style.display = 'none';
    }
  </script>
</body>
</html>
