:root{color-scheme:dark;--line:#323a43;--text:#f4f6f8;--muted:#adb6c1;--accent:#78c69a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#293139,#090c10 55%,#050607);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:28px 18px 48px}h1{font-size:clamp(24px,4vw,42px);font-weight:500;margin:0 0 8px}.lead,.note{color:var(--muted)}.viewer{margin-top:22px;background:linear-gradient(160deg,#171c22,#0c0f13);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 22px 65px #0009}.stage{position:relative;aspect-ratio:3/2;background:#050608;cursor:ew-resize;user-select:none;touch-action:pan-y;overflow:hidden}.frame{position:absolute;inset:0;background-image:url('2026-08-07_seiko-astron-hab005j_turntable-8view_v1.0.png');background-size:400% 200%;background-repeat:no-repeat}.stage:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 70px #0008;pointer-events:none}.info{padding:16px}.info h2{font-size:20px;font-weight:500;margin:0}.angle{color:var(--accent)}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}.controls button{border:1px solid var(--line);background:#181d23;color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer}.controls button:hover{border-color:var(--accent)}.controls label{color:var(--muted);font-size:13px;margin-left:auto}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:20px}.fact{background:#11151a;padding:14px}.fact b{display:block;color:var(--accent);font-weight:500}.fact span{color:var(--muted);font-size:13px}@media(max-width:650px){.facts{grid-template-columns:1fr 1fr}.controls label{width:100%;margin-left:0}}</style></head><body><main>
<h1>Seiko Astron HAB005J 360度ビュー</h1><p class="lead">8方向を45度刻みで一方向へ連続回転。正面、側面、背面、ケース厚を確認できます。</p>
<article class="viewer"><div class="stage" style="width:min(100%,520px);aspect-ratio:3/4;margin:0 auto" aria-label="セイコー アストロン HAB005J 多角度回転イメージ"><div class="frame"></div></div><div class="info"><h2>Astron HAB005J <span class="angle">0°</span></h2><div class="controls"><button data-prev>← 45°</button><button data-play>停止</button><button data-next>45° →</button><label>速度 <input data-speed type="range" min="1400" max="6000" step="200" value="2800"></label></div><p class="note">AI生成による8方向の説明用CG。公式写真・実物の連続撮影ではなく、細部の完全一致は保証しません。</p></div></article>
<section class="facts"><div class="fact"><b>330,000円</b><span>HAB005J</span></div><div class="fact"><b>GPSソーラー</b><span>38タイムゾーン</span></div><div class="fact"><b>121 g</b><span>純チタン／43.4 mm幅</span></div><div class="fact"><b>10気圧</b><span>世界限定1,200本</span></div></section>
</main><script>
const frame=document.querySelector('.frame'),angle=document.querySelector('.angle'),play=document.querySelector('[data-play]'),speed=document.querySelector('[data-speed]'),stage=document.querySelector('.stage');const pos=[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[3,1]];let i=0,running=true,timer,start=null;function show(n){i=(n+8)%8;frame.style.backgroundPosition=`${pos[i][0]*100/3}% ${pos[i][1]*100}%`;angle.textContent=`${i*45}°`}function schedule(){clearInterval(timer);if(running)timer=setInterval(()=>show(i+1),Number(speed.value))}document.querySelector('[data-prev]').onclick=()=>{show(i-1);schedule()};document.querySelector('[data-next]').onclick=()=>{show(i+1);schedule()};play.onclick=()=>{running=!running;play.textContent=running?'停止':'再生';schedule()};speed.oninput=schedule;stage.onpointerdown=e=>{start=e.clientX;stage.setPointerCapture(e.pointerId)};stage.onpointerup=e=>{if(start!==null&&Math.abs(e.clientX-start)>24)show(i+(e.clientX<start?1:-1));start=null;schedule()};show(0);schedule();
</script></body></html>
