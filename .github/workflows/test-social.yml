name: Test social automation
on:
  pull_request:
    paths:
      - 'scripts/social/**'
      - 'tests/social/**'
      - 'social/**'
      - 'docs/SNS_AUTOMATION.md'
      - '.github/workflows/*social*'
  push:
    branches: [main]
    paths:
      - 'scripts/social/**'
      - 'tests/social/**'
      - 'social/**'
      - 'docs/SNS_AUTOMATION.md'
      - '.github/workflows/*social*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/social/requirements.txt
      - run: python -m unittest discover -s tests/social -v
      - run: python -m scripts.social catalog > /dev/null
      - run: node --check social/studio/app.js
