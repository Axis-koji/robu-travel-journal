name: Robu free posting app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "preview=アプリ確認 / initialize=初期化 / connect=接続 / publish=公開と投稿"
        type: choice
        options: [preview, initialize, connect, publish]
        default: preview
      preview_article:
        description: "確認用の記事フォルダ名（previewのみ使用）"
        type: string
        default: vietnam-coffee
      exclude_current:
        description: "connectで再開する際、現在の既存記事をすべて除外する"
        type: boolean
        default: false

# Serializes initialization, deployments and delivery state writes together.
concurrency:
  group: blog-publish-social
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOCIAL_AUTO_PLATFORMS: ${{ vars.SOCIAL_AUTO_PLATFORMS }}
  SOCIAL_PUBLISH_ENABLED: ${{ vars.SOCIAL_PUBLISH_ENABLED }}
  META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
  FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
  INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
  THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
  PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
  PINTEREST_STANDARD_ACCESS: ${{ vars.PINTEREST_STANDARD_ACCESS }}

jobs:
  initialize:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'initialize' &&
      github.ref == 'refs/heads/main' && vars.SOCIAL_SITE_REPOSITORY == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/social/requirements.txt
      - name: Exclude existing articles without posting
        run: python -m scripts.social initialize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  connect:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'connect' &&
      github.ref == 'refs/heads/main' && vars.SOCIAL_SITE_REPOSITORY == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/social/requirements.txt
      - name: Verify targets and exclude existing articles for new connections
        run: |
          if [ "$EXCLUDE_CURRENT" = "true" ]; then
            python -m scripts.social connect --exclude-current
          else
            python -m scripts.social connect
          fi
        env:
          EXCLUDE_CURRENT: ${{ inputs.exclude_current }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}

  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview') ||
      (github.ref == 'refs/heads/main' && vars.SOCIAL_SITE_REPOSITORY == github.repository &&
       (github.event_name == 'push' || inputs.mode == 'publish'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/social/requirements.txt
      - uses: actions/cache@v4
        with:
          path: _social_media
          key: ${{ runner.os }}-robu-social-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-robu-social-v2-
      - name: Install Japanese fonts and video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
      - run: python -m unittest discover -s tests/social -v
      - name: Build preview only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: python -m scripts.social build --preview-article "$PREVIEW_ARTICLE"
        env:
          PREVIEW_ARTICLE: ${{ inputs.preview_article }}
      - name: Build site and social media
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'preview'
        run: python -m scripts.social build --ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: social-preview-and-plan
          path: |
            _social/
            _site/assets/social/
            _site/social-studio/
            _site/social-posting-app.zip
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'preview'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'preview'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  social:
    needs: deploy
    if: vars.SOCIAL_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/social/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: social-preview-and-plan
          path: _download
      - name: Send new articles after successful deployment
        run: python -m scripts.social publish --plan _download/_social/plan.json
        env:
          SOCIAL_PUBLISH_ENABLED: ${{ vars.SOCIAL_PUBLISH_ENABLED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
