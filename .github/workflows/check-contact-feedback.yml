name: Check contact feedback form

on:
  pull_request:
    paths:
      - "articles/**"
      - "assets/js/contact-feedback.js"
      - "assets/js/site.js"
      - "assets/js/shared-shell.js"
      - "assets/css/shared-shell.css"
      - "scripts/check-contact-feedback.ps1"
      - "scripts/check-article-shell.ps1"
      - ".github/workflows/check-contact-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every article loads the shared contact form
        shell: pwsh
        run: ./scripts/check-contact-feedback.ps1
      - name: Verify the formal article shell and translation menu
        shell: pwsh
        run: ./scripts/check-article-shell.ps1
