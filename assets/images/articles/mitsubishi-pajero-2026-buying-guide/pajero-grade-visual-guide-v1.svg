<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pajero grade visual guide</title>
  <desc id="desc">A four-column editorial diagram comparing grade-specific wheels, rear lighting, grille and roof rails without reproducing the actual vehicle.</desc>
  <rect width="1600" height="900" fill="#111820"/>
  <text x="80" y="92" fill="#ffffff" font-family="Meiryo, Arial, sans-serif" font-size="48" font-weight="700">新型パジェロ 4グレード 外観の違い</text>
