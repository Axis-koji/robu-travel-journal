  <!-- Clear tabular redesign: this overlay replaces the earlier abstract-icon layout. -->
  <rect width="1600" height="900" fill="#101820"/>
  <text x="72" y="82" fill="#ffffff" font-family="Meiryo, Arial, sans-serif" font-size="46" font-weight="700">新型パジェロ 4グレード比較</text>
  <text x="72" y="126" fill="#b8c2cc" font-family="Meiryo, Arial, sans-serif" font-size="22">価格と外観の違いを、公式装備表から一目で確認</text>
  <g aria-label="Mitsubishi three-diamond mark and name">
    <g transform="translate(1280 22) scale(4.5)"><path d="M8 22.38H0l4-6.92h8zm8 0h8l-4-6.92h-8zm0-13.84l-4-6.92-4 6.92 4 6.92Z" fill="#e60012"/></g>
    <text x="1398" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">MITSUBISHI MOTORS</text>
