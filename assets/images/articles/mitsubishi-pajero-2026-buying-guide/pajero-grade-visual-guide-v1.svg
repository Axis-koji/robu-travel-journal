    <g transform="translate(0 352)"><rect width="1480" height="112" rx="12" fill="#1c2730" stroke="#6e7a85" stroke-width="2"/><text x="22" y="48" fill="#ffffff" font-size="25" font-weight="700">GSR</text><text x="267" y="48" fill="#ffffff" font-size="25">676万5000円</text><text x="477" y="42" fill="#ffffff" font-size="22">18インチ</text><text x="477" y="75" fill="#b8c2cc" font-size="18">ダークグレー</text><text x="717" y="48" fill="#ffffff" font-size="22">通常点灯LED</text><text x="1012" y="42" fill="#ffffff" font-size="22">ダーク</text><text x="1012" y="75" fill="#b8c2cc" font-size="18">ウォームグレー</text><text x="1272" y="48" fill="#ffffff" font-size="22">あり</text></g>
    <g transform="translate(0 478)"><rect width="1480" height="112" rx="12" fill="#1c2730" stroke="#6e7a85" stroke-width="2"/><text x="22" y="48" fill="#ffffff" font-size="25" font-weight="700">GLS</text><text x="267" y="48" fill="#ffffff" font-size="25">619万3000円</text><text x="477" y="42" fill="#ffffff" font-size="22">18インチ</text><text x="477" y="75" fill="#b8c2cc" font-size="18">ダークグレー</text><text x="717" y="48" fill="#ffffff" font-size="22">通常点灯LED</text><text x="1012" y="42" fill="#ffffff" font-size="22">ダーク</text><text x="1012" y="75" fill="#b8c2cc" font-size="18">ウォームグレー</text><text x="1272" y="48" fill="#ffffff" font-size="22">なし</text></g>
  </g>
  <text x="72" y="840" fill="#b8c2cc" font-family="Meiryo, Arial, sans-serif" font-size="20">編集図：実際の車体形状とボディカラーは、記事内の三菱自動車公式360°表示で確認できます。</text>
