<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pajero dimensions and parking guide</title>
  <desc id="desc">An original top and side view dimensions diagram for planning parking space.</desc>
  <rect width="1600" height="900" fill="#f4f1ea"/>
  <text x="80" y="90" fill="#1e2933" font-family="Arial, sans-serif" font-size="48" font-weight="700">SIZE &amp; PARKING CHECK</text>
  <g transform="translate(100 170)" fill="none" stroke="#283641">
    <rect x="160" y="40" width="820" height="320" rx="120" stroke-width="12"/>
    <rect x="330" y="76" width="480" height="248" rx="74" stroke-width="8" fill="#dfe6ea"/>
    <path d="M230 68v264M910 68v264" stroke-width="8"/>
    <path d="M160 400h820M160 382v36M980 382v36" stroke="#b04a33" stroke-width="7"/>
    <text x="505" y="452" fill="#b04a33" stroke="none" font-family="Arial, sans-serif" font-size="34" font-weight="700">4,920 mm</text>
    <path d="M1030 40v320M1012 40h36M1012 360h36" stroke="#b04a33" stroke-width="7"/>
    <text x="1070" y="210" fill="#b04a33" stroke="none" font-family="Arial, sans-serif" font-size="34" font-weight="700">1,925 mm</text>
  </g>
  <g transform="translate(210 650)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="1180" height="125" rx="18" fill="#ffffff" stroke="#c6cdd2" stroke-width="3"/>
    <text x="40" y="50" fill="#1e2933" font-size="31" font-weight="700">HEIGHT</text>
    <text x="40" y="94" fill="#b04a33" font-size="34" font-weight="700">1,910 mm</text>
    <text x="330" y="50" fill="#1e2933" font-size="31" font-weight="700">WHEELBASE</text>
    <text x="330" y="94" fill="#b04a33" font-size="34" font-weight="700">2,870 mm</text>
    <text x="690" y="50" fill="#1e2933" font-size="31" font-weight="700">PLAN BEFORE PARKING</text>
    <text x="690" y="94" fill="#52616d" font-size="27">Width • height • door clearance</text>
  </g>
  <!-- Clear Japanese size table: this overlay replaces the earlier parking illustration. -->
  <rect width="1600" height="900" fill="#f3f1ec"/>
  <rect x="0" y="0" width="1600" height="170" fill="#111820"/>
  <text x="76" y="78" fill="#ffffff" font-family="Meiryo, Arial, sans-serif" font-size="48" font-weight="700">新型パジェロ ボディサイズ</text>
  <text x="76" y="126" fill="#c3ccd4" font-family="Meiryo, Arial, sans-serif" font-size="23">駐車スペースを見るときに必要な4つの数字</text>
  <g aria-label="Mitsubishi three-diamond mark and name">
    <g transform="translate(1280 22) scale(4.5)"><path d="M8 22.38H0l4-6.92h8zm8 0h8l-4-6.92h-8zm0-13.84l-4-6.92-4 6.92 4 6.92Z" fill="#e60012"/></g>
    <text x="1398" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">MITSUBISHI MOTORS</text>
  </g>
  <g font-family="Meiryo, Arial, sans-serif">
    <g transform="translate(70 230)"><rect width="700" height="230" rx="24" fill="#ffffff" stroke="#ccd3d8" stroke-width="3"/><text x="42" y="70" fill="#52616d" font-size="30" font-weight="700">全長</text><text x="42" y="160" fill="#b04a33" font-size="62" font-weight="700">4,920 mm</text></g>
    <g transform="translate(830 230)"><rect width="700" height="230" rx="24" fill="#ffffff" stroke="#ccd3d8" stroke-width="3"/><text x="42" y="70" fill="#52616d" font-size="30" font-weight="700">全幅</text><text x="42" y="160" fill="#b04a33" font-size="62" font-weight="700">1,925 mm</text></g>
    <g transform="translate(70 500)"><rect width="700" height="230" rx="24" fill="#ffffff" stroke="#ccd3d8" stroke-width="3"/><text x="42" y="70" fill="#52616d" font-size="30" font-weight="700">全高</text><text x="42" y="150" fill="#b04a33" font-size="58" font-weight="700">1,910 mm</text><text x="42" y="195" fill="#52616d" font-size="23">GSR・GLSは1,900 mm</text></g>
    <g transform="translate(830 500)"><rect width="700" height="230" rx="24" fill="#ffffff" stroke="#ccd3d8" stroke-width="3"/><text x="42" y="70" fill="#52616d" font-size="30" font-weight="700">ホイールベース</text><text x="42" y="160" fill="#b04a33" font-size="62" font-weight="700">2,870 mm</text></g>
  </g>
  <text x="76" y="810" fill="#52616d" font-family="Meiryo, Arial, sans-serif" font-size="24">寸法は三菱自動車の公式発表をもとにした編集表です。</text>
</svg>
